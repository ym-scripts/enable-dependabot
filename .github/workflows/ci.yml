name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS covers bash 3.2
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning enable-dependabot.sh test/run.sh test/gh
      - run: bash -n enable-dependabot.sh
      - run: bash test/run.sh
